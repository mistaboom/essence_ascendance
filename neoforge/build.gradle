plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

loom {
    runs {
        server {
            ideConfigGenerated = false
        }
        client {
            programArg "--username"
            programArg "ReedDev"

            programArg "--uuid"
            programArg "0e0b750fe8aa3304aa414466ca4fc44e"

            ideConfigGenerated = false
        }
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    def optionalApi = project.targetRemap ? 'modCompileOnly' : 'compileOnly'
    def runtimeMod = project.targetRemap ? 'modImplementation' : 'implementation'
    add(optionalApi, "dev.ftb.mods:ftb-teams-neoforge:${project.targetFtbTeams}") { transitive = false }
    add(optionalApi, "dev.ftb.mods:ftb-library-neoforge:${project.targetFtbLibrary}") { transitive = false }
    add(runtimeMod, "dev.architectury:architectury-neoforge:${project.targetArchitecturyApi}")
    neoForge "net.neoforged:neoforge:${project.targetNeoForge}"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    if (project.targetRemap)
        common(project(path: project.targetCommon.path, configuration: 'namedElements')) { transitive = false }
    else
        common(project(path: project.targetCommon.path)) { transitive = false }
    shadowBundle project(path: project.targetCommon.path, configuration: 'transformProductionNeoForge')
}

apply from: rootProject.file('gradle/team-development.gradle')
repositories { maven { url = 'https://maven.ftb.dev/releases' } }

processResources {
    inputs.property 'nativeAccess', project.targetNativeAccess
    if (!project.targetNativeAccess) exclude 'META-INF/accesstransformer.cfg'
    def metadata = [version: project.version,
                    neoforge_requirement: "[${project.targetNeoForgeMin},)",
                    minecraft_requirement: "[${project.targetMinecraft}]",
                    architectury_requirement: "[${project.targetArchitecturyApi},)"]
    inputs.properties(metadata)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand metadata
    }
    if (!project.targetNativeAccess) {
        doLast {
            def metadataFile = new File(destinationDir, 'META-INF/neoforge.mods.toml')
            metadataFile.text = metadataFile.text.replaceAll('(?m)\\r?\\n\\[\\[accessTransformers\\]\\]\\r?\\nfile="META-INF/accesstransformer\\.cfg"\\r?\\n?', '\n')
        }
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

if (project.targetRemap) {
    remapJar {
        inputFile.set shadowJar.archiveFile
    }
} else {
    shadowJar.archiveClassifier = ''
    jar.archiveClassifier = 'dev'
    tasks.named('build') { dependsOn tasks.named('shadowJar') }
}

repositories { maven { url = 'https://chocolateminecraft.com/maven' } }
