# Generation inputs. Existing files are never overwritten.
# Changes apply to a fresh generation or an explicit rebuild; saved profiles remain authoritative.
# Skill unlock tiers belong in skill_settings.toml. Bonus bounds belong in bonus_settings.toml.
schema_version = 1

# [[fact]] corrects registered item, equipment, enemy or recipe measurements.
# Supported kinds: item, block, item_tag, block_tag, enemy, recipe, recipe_family.
# Selectors use registry IDs; item/block/enemy/recipe selectors also accept * wildcards.
# Tags use a namespaced tag ID, optionally prefixed by #.
# Give every fact a unique id. Higher priority wins; default priority is 1000.
# Equal priority is resolved by confidence (0..1), then stable fact ID.
# reason is a nonempty explanatory string. All numeric measurements are nonnegative and finite.
# These measurements do not establish survival access, quest gates, automation or renewable supply.

# Item/block/tag fields:
#   disabled, creative_only, administrative, joke, include_reference: true/false
#   resource_value: explicit intrinsic item-value estimate
#   slot: head, chest, legs, feet, body, offhand, mainhand_melee, mainhand_bow,
#         mainhand_crossbow, mainhand_caster or mainhand_tool
#   armor, toughness, damage, attack_speed, mining_speed, harvest_level, durability
#   stage: entry, early, mid, late or apex (relative catalog strength, not acquisition timing)
# Equipment fields correct existing measurable equipment references; they do not create gameplay abilities.
# Explicit exclusion cannot be combined with include_reference=true in the same fact.
#
# [[fact]]
# id = "exclude_admin_item"
# kind = "item"
# selector = "example:admin_tool"
# administrative = true
# reason = "Administrative item; exclude from ordinary reference statistics."
#
# [[fact]]
# id = "material_estimate"
# kind = "item_tag"
# selector = "example:refined_materials"
# resource_value = 24.0
#
# [[fact]]
# id = "measured_weapon"
# kind = "item"
# selector = "example:sword"
# slot = "mainhand_melee"
# damage = 8.0
# attack_speed = 1.6
# stage = "mid"

# Enemy fields: the exclusion flags above, include_reference, stage, health, armor,
# toughness and damage. Only registered native hostile references are considered.
#
# [[fact]]
# id = "measured_enemy"
# kind = "enemy"
# selector = "example:sentinel"
# health = 80.0
# damage = 8.0

# Recipe/recipe_family fields: disabled, confidence, reason, processing_time (ticks),
# output_count (positive whole count) and probability (0..1).
#
# [[fact]]
# id = "measured_recipe"
# kind = "recipe"
# selector = "example:refining"
# output_count = 2
# probability = 0.5
# processing_time = 200

# Exact overrides are exceptional final runtime/economy values. Keys are JSON Pointers.
# Each target must exist and accept the supplied type. Native limits and accounting checks still apply.
# Escape ~ as ~0 and / inside an identifier as ~1. These are not dotted TOML paths.
[exact]
# "/runtime/statMaxBonuses/essence_ascendance:movement_speed" = 50.0
# "/economy/resources/minecraft:iron_ingot/routedYields/essence_ascendance:construction" = 12
