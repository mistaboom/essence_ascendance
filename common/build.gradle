repositories {
    maven { url = 'https://maven.ftb.dev/releases' }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

architectury {
    common rootProject.targetCatalog.targets.findAll { it.minecraft == project.targetMinecraft }.collect { it.loader }
}

apply from: rootProject.file('gradle/assets.gradle')

if (project.targetResourceFormat == '26.1') {
    tasks.named('compileTestJava', JavaCompile) {
        options.compilerArgs += ['-Xmaxerrs', '10000']
    }
    // Historical focused names reuse the complete normal source set and original suites.
    // The temporary second compiler/source whitelist is no longer needed.
    [
            focusedFullscreenComposition2612: 'fullscreenCompositionInvariants',
            focusedInventoryItemAssets2612: 'inventoryItemAssetInvariants',
            focusedTooltipPresentation2612: 'balanceTooltipPresentationInvariants',
            focusedSharedPresentation2612: 'sharedPresentationInvariants',
            focusedLatentOreResources2612: 'latentOreResourceInvariants',
            focusedFullscreenNavigation2612: 'fullscreenNavigationInvariants',
            focusedNexusBonusPresentation2612: 'bonusTrackPresentationInvariants'
    ].each { alias, original ->
        tasks.register(alias) {
            group = 'verification'
            dependsOn original
        }
    }
    tasks.register('glaiveRenderContract2612', JavaExec) {
        group = 'verification'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'com.mistaboom.essence_ascendance.client.GlaiveRenderContract2612Test'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(project.targetJava) }
    }
    tasks.register('explosionNativeHookSelectorInvariants', JavaExec) {
        group = 'verification'
        description = 'Checks compiled explosion selectors and required invocation counts against both exact native loaders.'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'com.mistaboom.essence_ascendance.verification.ExplosionNativeHookSelectorTest'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(project.targetJava) }
    }
    tasks.named('check') { dependsOn 'explosionNativeHookSelectorInvariants' }
}

// Both loaders bundle common resources; keep the launcher icon's source in branding.
tasks.named('processResources') {
    inputs.property 'resourceFormat', project.targetResourceFormat
    inputs.property 'fabricNativeAccess', rootProject.targetCatalog.versions[project.targetMinecraft].nativeAccess.fabric ?: false
    if (!rootProject.targetCatalog.versions[project.targetMinecraft].nativeAccess.fabric) exclude 'essence_ascendance.accesswidener'
    from(rootProject.file('art/branding/essence_ascendance_logo_256.png')) {
        rename { 'icon.png' }
    }
    if (project.targetResourceFormat == '26.1') {
        // Vanilla's 26.1 ingredient codec uses item IDs and #tag IDs directly.
        // Convert only the target output so the authored 1.21.1 recipes remain valid.
        doLast {
            def recipeDir = new File(destinationDir, 'data/essence_ascendance/recipe')
            fileTree(recipeDir).matching { include '*.json' }.files.each { recipeFile ->
                def recipe = new groovy.json.JsonSlurper().parse(recipeFile)
                if (recipe.type == 'minecraft:crafting_shaped') {
                    recipe.key.replaceAll { symbol, ingredient ->
                        ingredient.item ?: "#${ingredient.tag}"
                    }
                } else if (recipe.type == 'minecraft:crafting_shapeless') {
                    recipe.ingredients = recipe.ingredients.collect { ingredient ->
                        ingredient.item ?: "#${ingredient.tag}"
                    }
                } else if (recipe.type in ['minecraft:smelting', 'minecraft:blasting']) {
                    recipe.ingredient = recipe.ingredient.item ?: "#${recipe.ingredient.tag}"
                } else {
                    return
                }
                recipeFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(recipe)) + '\n'
            }
            // 26.1 special item models use these authored display transforms as a base.
            // The removed builtin/entity parent is not a renderable vanilla model anymore.
            ['essence_pylon', 'essence_infuser', 'essence_focus', 'essence_crucible',
             'ascendance_nexus'].each { name ->
                def modelFile = new File(destinationDir, "assets/essence_ascendance/models/item/${name}.json")
                def model = new groovy.json.JsonSlurper().parse(modelFile)
                if (model.parent != 'builtin/entity')
                    throw new GradleException("Expected authored special item transform base: ${modelFile}")
                model.remove('parent')
                def particle = name == 'essence_focus' ? 'item/focus' : "block/${name}"
                model.textures = [particle: "essence_ascendance:${particle}"]
                modelFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(model)) + '\n'
            }
        }
    }
}

def armorSource = rootProject.file('art/source/models/armor/ascendance_armor.bbmodel')
def armorMaskDirectory = layout.buildDirectory.dir('asset-work/armor-masks').get().asFile

dependencies {
    def optionalApi = project.targetRemap ? 'modCompileOnly' : 'compileOnly'
    def runtimeMod = project.targetRemap ? 'modImplementation' : 'implementation'
    add(optionalApi, "dev.ftb.mods:ftb-teams:${project.targetFtbTeams}") { transitive = false }
    add(optionalApi, "dev.ftb.mods:ftb-library:${project.targetFtbLibrary}") { transitive = false }
    if (!project.targetRemap) {
        // The optional API boundary fixture runs against the selected unremapped tuple.
        testImplementation("dev.ftb.mods:ftb-teams:${project.targetFtbTeams}") { transitive = false }
        testImplementation("dev.ftb.mods:ftb-library:${project.targetFtbLibrary}") { transitive = false }
    }
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    add(runtimeMod, "net.fabricmc:fabric-loader:${project.targetFabricLoader}")

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    add(runtimeMod, "dev.architectury:architectury:${project.targetArchitecturyApi}")

    // Optional JEI API only. JEI is not bundled or required at runtime.
    compileOnly "mezz.jei:jei-${project.targetMinecraft}-common-api:${project.targetJeiCommonApi}"
    testImplementation "mezz.jei:jei-${project.targetMinecraft}-common-api:${project.targetJeiCommonApi}"
}

loom {
    if (rootProject.targetCatalog.versions[project.targetMinecraft].nativeAccess.fabric)
        accessWidenerPath = rootProject.file('common/src/main/resources/essence_ascendance.accesswidener')
}

