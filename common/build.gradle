balanceInvariantMains.each { taskName, className ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = "Runs ${className.tokenize('.').last()} against the mapped game dependencies."
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = className
        if (taskName == 'balanceAscensionPolicyInvariants' && rootProject.hasProperty('attunementReplayProfile')) {
            // Optional read-only integration replay of a real saved evidence profile; output stays in build/.
            args rootProject.file(rootProject.property('attunementReplayProfile')).absolutePath,
                    rootProject.layout.buildDirectory.file('attunement-calibration-replay.txt').get().asFile.absolutePath
        }
    }
}
// These eight suites own local fixtures only: no game bootstrap or installed runtime profile.
// Keep each original JavaExec task for isolated debugging. Never run both paths from check.
def lightweightTasks = [
        'balanceConfigInvariants', 'balanceDocumentInvariants', 'balanceEvidenceInvariants',
        'balanceCompositionInvariants', 'balanceTooltipInvariants', 'balanceRankInvariants',
        'statusPolicyInvariants', 'vitalityRecoveryInvariants'
]
def nativeShapeTasks = [
        'recoveryNativeHookShapeInvariants', 'sustenanceNativeHookShapeInvariants',
        'postureNativeHookShapeInvariants', 'statusNativeHookShapeInvariants', 'guardNativeHookShapeInvariants'
]
// Full generated-profile sweeps/replays are intentionally expensive and have a named opt-in owner.
def generationTasks = ['balanceIntegrationInvariants', 'balanceRuntimeInvariants', 'balanceAscensionPolicyInvariants']
tasks.register('lightweightInvariants', JavaExec) {
    group = 'verification'
    description = 'Runs reviewed local-fixture invariants in one JVM, reporting each failing class.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mistaboom.essence_ascendance.verification.InvariantSuite'
    def members = lightweightTasks.collect { balanceInvariantMains[it] }
    // An explicit diagnostic rerun verifies that the shared suites do not depend on execution order.
    args(rootProject.hasProperty('reverseInvariantOrder') ? members.reverse() : members)
}
tasks.register('balanceInvariants') {
    group = 'verification'
    description = 'Normal-build regression contract: lightweight, registry, accounting, codec and profile invariants.'
    dependsOn balanceInvariantMains.keySet().findAll {
        !(it in lightweightTasks) && !(it in nativeShapeTasks) && !(it in generationTasks)
    }
    dependsOn tasks.named('lightweightInvariants')
}
tasks.named('check') { dependsOn tasks.named('balanceInvariants') }

// Explicit development refresh from verified saved pack evidence. It never opens a world.
tasks.register('regenerateSavedBalance', JavaExec) {
    group = 'development tools'
    description = 'Regenerates and validates a profile from saved evidence without opening a Minecraft world.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mistaboom.essence_ascendance.balance.generated.SavedEvidenceRegenerationTool'
    doFirst {
        if (!rootProject.hasProperty('savedBalanceConfig') || !rootProject.hasProperty('savedBalanceOutput'))
            throw new GradleException('Supply -PsavedBalanceConfig and -PsavedBalanceOutput')
        args rootProject.file(rootProject.property('savedBalanceConfig')).absolutePath,
                rootProject.file(rootProject.property('savedBalanceOutput')).absolutePath
    }
}

// Refresh only derived reports from an already validated saved profile; inputs stay byte-identical.
tasks.register('exportSavedBalance', JavaExec) {
    group = 'development tools'
    description = 'Exports reports from the saved profile without regeneration or opening a Minecraft world.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mistaboom.essence_ascendance.balance.generated.ExportSavedBalanceTool'
    doFirst {
        if (!rootProject.hasProperty('balanceConfigDir'))
            throw new GradleException('Supply -PbalanceConfigDir with the existing Minecraft config directory')
        args rootProject.file(rootProject.property('balanceConfigDir')).absolutePath
    }
}

// Standard test is a useful entry point even though framework discovery is empty.
// testClasses does not depend on test, so this introduces no dependency cycle.
tasks.named('test', Test) {
    dependsOn tasks.named('balanceInvariants')
    failOnNoDiscoveredTests = false
}

// Focused, opt-in checks for the Vitality damage batch. Deliberately NOT dependencies of build/check.
[
    vitalityDamageMathInvariants: 'com.mistaboom.essence_ascendance.vitality.VitalityDamageMathTest',
    healingRoutingMathInvariants: 'com.mistaboom.essence_ascendance.vitality.HealingRoutingMathTest',
    vitalityDamageBatchInvariants: 'com.mistaboom.essence_ascendance.vitality.VitalityDamageBatchContractTest',
    vitalityDamageNativeHookShapeInvariants: 'com.mistaboom.essence_ascendance.vitality.VitalityDamageNativeHookShapeTest'
].each { taskName, className ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = 'Opt-in Vitality damage batch verification (not part of normal build).'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = className
    }
}
// A passing parity check must inspect a real mapped NeoForge class, never an absent-cache substitute.
tasks.named('vitalityDamageNativeHookShapeInvariants') { dependsOn ':fabric:compileJava', ':neoforge:compileJava' }

// Focused opt-in traversal checks; deliberately do not add work to normal build/check.
[
    traversalRulesInvariants: 'com.mistaboom.essence_ascendance.movement.TraversalRulesTest',
    traversalBatchInvariants: 'com.mistaboom.essence_ascendance.movement.TraversalBatchContractTest',
    traversalNativeHookShapeInvariants: 'com.mistaboom.essence_ascendance.movement.TraversalNativeHookShapeTest'
].each { taskName, className ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = 'Opt-in terrain/fluid traversal verification (not part of normal build).'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = className
    }
}
tasks.named('traversalNativeHookShapeInvariants') { dependsOn ':neoforge:compileJava' }

// All shape checks require real mapped classes for both loaders, including on a fresh common-only run.
nativeShapeTasks.each { name -> tasks.named(name) { dependsOn ':neoforge:compileJava' } }

tasks.register('vitalityInvariants') {
    group = 'verification'
    description = 'Focused Vitality recovery, sustenance, damage, healing, schema and native hook shapes.'
    dependsOn 'vitalityBatchContractInvariants', 'vitalityBalanceInvariants', 'vitalityRecoveryInvariants',
            'recoveryNativeHookShapeInvariants', 'vitalitySustenanceInvariants', 'sustenanceNativeHookShapeInvariants',
            'vitalityDamageMathInvariants', 'healingRoutingMathInvariants', 'vitalityDamageBatchInvariants',
            'vitalityDamageNativeHookShapeInvariants'
}
tasks.register('traversalInvariants') {
    group = 'verification'
    description = 'Focused terrain/fluid traversal, guard movement and native hook shapes.'
    dependsOn 'traversalRulesInvariants', 'traversalBatchInvariants', 'traversalNativeHookShapeInvariants',
            'guardMovementInvariants', 'guardNativeHookShapeInvariants'
}
tasks.register('combatInvariants') {
    group = 'verification'
    description = 'Focused projectile, guard, posture and status contracts and native hook shapes.'
    dependsOn 'projectileSkillBatchInvariants', 'balanceProjectileInvariants', 'projectilePayloadInvariants',
            'projectileControlInvariants', 'balanceGuardInvariants', 'guardOutcomeInvariants',
            'guardCounterattackInvariants', 'guardNativeHookShapeInvariants', 'defenseCompletionInvariants',
            'postureStatusBalanceInvariants', 'postureMeterInvariants', 'postureNativeHookShapeInvariants',
            'statusPolicyInvariants', 'statusNativeHookShapeInvariants', 'skillHudPresentationInvariants'
}
tasks.register('focusedInvariants') {
    group = 'verification'
    description = 'All supported focused domain suites; excludes deferred guidebook and loader launches.'
    dependsOn 'vitalityInvariants', 'traversalInvariants', 'combatInvariants', 'balanceGenerationInvariants'
}
tasks.register('balanceGenerationInvariants') {
    group = 'verification'
    description = 'Full generated-profile integration, runtime composition and ascension/evidence replay sweeps.'
    dependsOn generationTasks
    dependsOn 'meaningfulProgressionInvariants'
}
tasks.register('dormantGuidebookInvariants', JavaExec) {
    group = 'verification'
    description = 'Deferred guidebook delivery and recovery checks; explicit opt-in only.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mistaboom.essence_ascendance.progression.DormantGuidebookTest'
}

[
    durabilityDomainInvariants: 'com.mistaboom.essence_ascendance.equipment.DurabilityDomainTest',
    sharedTargetWorkInvariants: 'com.mistaboom.essence_ascendance.utility.SharedTargetWorkTest'
].each { taskName, className ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = className
    }
}
tasks.named('balanceInvariants') { dependsOn 'durabilityDomainInvariants', 'sharedTargetWorkInvariants' }
tasks.named('vitalityInvariants') { dependsOn 'durabilityDomainInvariants' }
tasks.named('combatInvariants') { dependsOn 'sharedTargetWorkInvariants' }

tasks.register('sharedPresentationInvariants', JavaExec) {
    group = 'verification'
    description = 'Generated tooltips, bonus prose, Latent gating, universal HUD and preference transport.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mistaboom.essence_ascendance.client.SharedPresentationTest'
}
tasks.named('balanceInvariants') { dependsOn 'sharedPresentationInvariants' }
