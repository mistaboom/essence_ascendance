// Standalone 26.1 JavaExec checks do not pass through a loader. Minecraft now
// binds built-in item components after registry bootstrap, so provide that
// lifecycle step before invoking each original invariant main with its args.
if (project.targetResourceFormat == '26.1') {
    tasks.withType(JavaExec).configureEach {
        doFirst {
            def invariantMain = mainClass.orNull
            if (invariantMain != null && invariantMain.startsWith('com.mistaboom.essence_ascendance.')
                    && invariantMain != 'com.mistaboom.essence_ascendance.verification.ExplosionNativeHookSelectorTest'
                    && invariantMain != 'com.mistaboom.essence_ascendance.verification.NativeTestLauncher2612') {
                def invariantArgs = args.collect { it.toString() }
                mainClass = 'com.mistaboom.essence_ascendance.verification.NativeTestLauncher2612'
                setArgs([invariantMain] + invariantArgs)
            }
        }
    }
}
