repositories {
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

architectury {
    common rootProject.enabled_platforms.split(',')
}

def generatedEssenceTextureResources = layout.buildDirectory.dir('generated-resources/essence-block-textures')
def essenceTextureGeneratorClasses = layout.buildDirectory.dir('essence-block-texture-generator/classes')
def essenceTextureGeneratorSource = rootProject.file('tools/EssenceBlockTextureGenerator.java')
def canonicalPaletteSource = file('src/main/java/com/mistaboom/essence_ascendance/visual/CanonicalPaletteValues.java')
def essenceBaseMask = file('src/main/resources/assets/essence_ascendance/textures/item/essence_block/base.png')
def essenceAccentMask = file('src/main/resources/assets/essence_ascendance/textures/item/essence_block/accent.png')

sourceSets.main.resources.srcDir(generatedEssenceTextureResources)

tasks.register('compileEssenceBlockTextureGenerator', JavaCompile) {
    source = files(essenceTextureGeneratorSource, canonicalPaletteSource)
    destinationDirectory = essenceTextureGeneratorClasses
    classpath = files()
    options.release = 21
}

tasks.register('generateEssenceBlockTextures', JavaExec) {
    dependsOn tasks.named('compileEssenceBlockTextureGenerator')
    classpath = files(essenceTextureGeneratorClasses)
    mainClass = 'EssenceBlockTextureGenerator'
    inputs.file(essenceTextureGeneratorSource)
    inputs.file(canonicalPaletteSource)
    inputs.file(essenceBaseMask)
    inputs.file(essenceAccentMask)
    outputs.dir(generatedEssenceTextureResources)
    doFirst {
        args(
                essenceBaseMask.absolutePath,
                essenceAccentMask.absolutePath,
                generatedEssenceTextureResources.get().asFile.absolutePath
        )
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('generateEssenceBlockTextures')
}

tasks.named('sourcesJar') {
    dependsOn tasks.named('generateEssenceBlockTextures')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Optional JEI API only. JEI is not bundled or required at runtime.
    // Keep a fallback here so older checkouts without jei_version in gradle.properties still configure cleanly.
    def jeiVersion = rootProject.findProperty('jei_version') ?: '19.43.0.395'
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jeiVersion}"
}

loom {
    accessWidenerPath = file("src/main/resources/essence_ascendance.accesswidener")
}

