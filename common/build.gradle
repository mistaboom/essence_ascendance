balanceInvariantMains.each { taskName, className ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = "Runs ${className.tokenize('.').last()} against the mapped game dependencies."
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = className
        systemProperty 'essence.minecraft', project.targetMinecraft
        systemProperty 'essence.neoforge.version', project.targetNeoForge
        if (taskName == 'balanceDocumentStreamingInvariants') maxHeapSize = '128m'
        if (taskName == 'balanceGeneratedSectionsInvariants') { maxHeapSize = '128m'; args '--stress' }
        if (taskName == 'nativeEquipmentHeadroomInvariants') maxHeapSize = '2g'
        if (taskName == 'equipmentBonusTierInvariants' && rootProject.hasProperty('equipmentBonusProfile'))
            args rootProject.file(rootProject.property('equipmentBonusProfile')).absolutePath
        if (taskName == 'ascendanceArmorInvariants') args armorSource.absolutePath, armorMaskDirectory.absolutePath
        if (taskName == 'balanceAscensionPolicyInvariants' && rootProject.hasProperty('attunementReplayProfile')) {
            // Optional read-only integration replay of a real saved evidence profile; output stays in build/.
            args rootProject.file(rootProject.property('attunementReplayProfile')).absolutePath,
                    rootProject.layout.buildDirectory.file('attunement-calibration-replay.txt').get().asFile.absolutePath
        }
    }
}
