repositories {
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Optional JEI API only. JEI is not bundled or required at runtime.
    // Keep a fallback here so older checkouts without jei_version in gradle.properties still configure cleanly.
    def jeiVersion = rootProject.findProperty('jei_version') ?: '19.43.0.395'
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jeiVersion}"
}

loom {
    accessWidenerPath = file("src/main/resources/essence_ascendance.accesswidener")
}

// Executable invariant suites use the real mapped Minecraft classpath and add no test library.
def balanceInvariantMains = [
        defenseCompletionInvariants: 'com.mistaboom.essence_ascendance.skill.effect.DefenseCompletionTest',
        postureStatusBalanceInvariants: 'com.mistaboom.essence_ascendance.balance.runtime.PostureStatusBalanceTest',
        postureMeterInvariants: 'com.mistaboom.essence_ascendance.posture.PostureMeterTest',
        postureNativeHookShapeInvariants: 'com.mistaboom.essence_ascendance.posture.PostureNativeHookShapeTest',
        statusPolicyInvariants: 'com.mistaboom.essence_ascendance.status.StatusPolicyTest',
        statusNativeHookShapeInvariants: 'com.mistaboom.essence_ascendance.status.StatusNativeHookShapeTest',
        skillHudPresentationInvariants: 'com.mistaboom.essence_ascendance.skill.effect.SkillEffectHudPresentationTest',
        guardNativeHookShapeInvariants: 'com.mistaboom.essence_ascendance.skill.effect.GuardNativeHookShapeTest',
        guardMovementInvariants: 'com.mistaboom.essence_ascendance.skill.effect.GuardMovementTest',
        guardOutcomeInvariants: 'com.mistaboom.essence_ascendance.guard.GuardOutcomeTest',
        guardCounterattackInvariants: 'com.mistaboom.essence_ascendance.skill.effect.GuardCounterattackTest',
        balanceConfigInvariants: 'com.mistaboom.essence_ascendance.balance.config.BalanceConfigTest',
        balanceDocumentInvariants: 'com.mistaboom.essence_ascendance.balance.generated.BalanceDocumentTest',
        balanceReportInvariants: 'com.mistaboom.essence_ascendance.balance.generated.BalanceReportsTest',
        balanceReportLayoutInvariants: 'com.mistaboom.essence_ascendance.balance.generated.BalanceReportLayoutTest',
        balanceEvidenceInvariants: 'com.mistaboom.essence_ascendance.balance.engine.BalanceEvidenceSelfTest',
        balanceProviderInvariants: 'com.mistaboom.essence_ascendance.balance.engine.ProviderReferenceTest',
        balanceCompositionInvariants: 'com.mistaboom.essence_ascendance.balance.engine.BuildCompositionTest',
        balanceEconomyInvariants: 'com.mistaboom.essence_ascendance.balance.economy.EconomyInvariantTest',
        balanceTradeInvariants: 'com.mistaboom.essence_ascendance.valuation.TradeGraphTest',
        balanceBiologicalSourceInvariants: 'com.mistaboom.essence_ascendance.valuation.BiologicalSourceEvidenceTest',
        balanceNaturalBlockInvariants: 'com.mistaboom.essence_ascendance.valuation.NaturalBlockEvidenceTest',
        balanceFractionalLedgerInvariants: 'com.mistaboom.essence_ascendance.balance.economy.FractionalLedgerTest',
        balanceTooltipInvariants: 'com.mistaboom.essence_ascendance.client.EssenceYieldFormatTest',
        balanceTooltipPresentationInvariants: 'com.mistaboom.essence_ascendance.client.TooltipPresentationTest',
        balanceRankInvariants: 'com.mistaboom.essence_ascendance.skill.SkillRankCurveTest',
        balanceLedgerInvariants: 'com.mistaboom.essence_ascendance.skill.balance.SkillRankLedgerTest',
        balanceIntegrationInvariants: 'com.mistaboom.essence_ascendance.balance.generated.GeneratedBalanceIntegrationTest',
        balanceLoadoutInvariants: 'com.mistaboom.essence_ascendance.skill.balance.SkillLoadoutProjectionTest',
        balanceRuntimeInvariants: 'com.mistaboom.essence_ascendance.balance.runtime.RuntimeBalanceTest',
        balanceAscensionPolicyInvariants: 'com.mistaboom.essence_ascendance.balance.runtime.RuntimeAscensionPolicyTest',
        attunementAccountingTest: 'com.mistaboom.essence_ascendance.attunement.AttunementAccountingTest',
        essenceCommandInvariants: 'com.mistaboom.essence_ascendance.command.EssenceCommandTest',
        dormantGuidebookInvariants: 'com.mistaboom.essence_ascendance.progression.DormantGuidebookTest',
        attunementPresentationInvariants: 'com.mistaboom.essence_ascendance.client.nexus.NexusAttunementPresentationTest',
        attunementNetworkInvariants: 'com.mistaboom.essence_ascendance.network.AttunementSnapshotCodecTest',
        attunementAdapterInvariants: 'com.mistaboom.essence_ascendance.attunement.AttunementAdapterTest',
        projectileSkillBatchInvariants: 'com.mistaboom.essence_ascendance.skill.effect.ProjectileSkillBatchTest',
        balanceProjectileInvariants: 'com.mistaboom.essence_ascendance.balance.runtime.ProjectileBalanceTest',
        balanceGuardInvariants: 'com.mistaboom.essence_ascendance.balance.runtime.GuardBalanceTest',
        projectilePayloadInvariants: 'com.mistaboom.essence_ascendance.projectile.ProjectilePayloadTest',
        projectileControlInvariants: 'com.mistaboom.essence_ascendance.projectile.ProjectileControlTest',
        balanceLifecycleInvariants: 'com.mistaboom.essence_ascendance.balance.runtime.RuntimeLifecycleTest'
]
balanceInvariantMains.each { taskName, className ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = "Runs ${className.tokenize('.').last()} against the mapped game dependencies."
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = className
        if (taskName == 'balanceAscensionPolicyInvariants' && rootProject.hasProperty('attunementReplayProfile')) {
            // Optional read-only integration replay of a real saved evidence profile; output stays in build/.
            args rootProject.file(rootProject.property('attunementReplayProfile')).absolutePath,
                    rootProject.layout.buildDirectory.file('attunement-calibration-replay.txt').get().asFile.absolutePath
        }
    }
}
tasks.register('balanceInvariants') {
    group = 'verification'
    description = 'Runs deterministic balance, economy, rank and profile invariants.'
    dependsOn balanceInvariantMains.keySet()
}
tasks.named('check') { dependsOn tasks.named('balanceInvariants') }

// Explicit development refresh from verified saved pack evidence. It never opens a world.
tasks.register('regenerateSavedBalance', JavaExec) {
    group = 'verification'
    description = 'Regenerates and validates a profile from saved evidence without opening a Minecraft world.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.mistaboom.essence_ascendance.balance.generated.SavedEvidenceRegenerationTool'
    doFirst {
        if (!rootProject.hasProperty('savedBalanceConfig') || !rootProject.hasProperty('savedBalanceOutput'))
            throw new GradleException('Supply -PsavedBalanceConfig and -PsavedBalanceOutput')
        args rootProject.file(rootProject.property('savedBalanceConfig')).absolutePath,
                rootProject.file(rootProject.property('savedBalanceOutput')).absolutePath
    }
}

// These test sources are executable main programs, so framework discovery is empty.
// The JavaExec invariant tasks above remain required by check and fail on any error.
tasks.named('test', Test) {
    failOnNoDiscoveredTests = false
}
