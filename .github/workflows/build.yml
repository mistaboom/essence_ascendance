name: Build mod artifacts

on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      release_type:
        value: ${{ jobs.build.outputs.release_type }}
      variants:
        value: ${{ jobs.build.outputs.variants }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release_type: ${{ steps.metadata.outputs.release_type }}
      variants: ${{ steps.artifacts.outputs.variants }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate version and release notes
        id: metadata
        run: python3 tools/release/prepare.py
      - name: Install the declared target Java toolchains
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # The final (newest) JDK is the launcher; Gradle selects each target's toolchain.
          java-version: ${{ steps.metadata.outputs.java_versions }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build and check the declared supported targets
        run: bash gradlew --no-daemon --console=plain :checkSupportedTargets
      - name: Verify release target selection
        run: python3 -m unittest discover -s tools/release -p "test_*.py"
      - name: Validate and collect production jars
        id: artifacts
        run: python3 tools/release/prepare.py --stage build/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: build/release/*
          if-no-files-found: error
          retention-days: 30
