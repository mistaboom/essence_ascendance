name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  github:
    name: Attach GitHub downloads
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release
      - name: Upload the verified jars and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          mapfile -t jars < <(jq -r '.variants[].file' release/metadata.json)
          test "${#jars[@]}" -eq "$(jq '.variants | length' release/metadata.json)"
          uploads=()
          for jar in "${jars[@]}"; do
            test -f "release/$jar"
            uploads+=("release/$jar")
          done
          gh release upload "$RELEASE_TAG" "${uploads[@]}" release/SHA256SUMS --clobber

  publish:
    name: ${{ matrix.platform }} / ${{ matrix.target.minecraft }} / ${{ matrix.target.loader }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Modrinth dependency inserts deadlocked during adjacent loader uploads.
      # Keep independent jobs, but avoid concurrent mod-site uploads in this release.
      max-parallel: 1
      matrix:
        platform: [curseforge, modrinth]
        target: ${{ fromJSON(needs.build.outputs.variants) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release
      - name: Verify downloaded jar checksums
        run: cd release && sha256sum --check SHA256SUMS
      - name: Check the platform token is configured
        env:
          PLATFORM: ${{ matrix.platform }}
          PLATFORM_TOKEN: ${{ secrets[matrix.platform == 'curseforge' && 'CURSEFORGE_ESSENCE_ASCENDANCE' || 'MODRINTH_ESSENCE_ASCENDANCE'] }}
        run: |
          if [ -z "$PLATFORM_TOKEN" ]; then
            echo "::error::Missing repository secret for $PLATFORM. See docs/RELEASING.md."
            exit 1
          fi
      - name: Publish the production jar
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          curseforge-id: ${{ matrix.platform == 'curseforge' && '1732850' || '' }}
          curseforge-token: ${{ matrix.platform == 'curseforge' && secrets.CURSEFORGE_ESSENCE_ASCENDANCE || '' }}
          modrinth-id: ${{ matrix.platform == 'modrinth' && 'zIJXnoE8' || '' }}
          modrinth-token: ${{ matrix.platform == 'modrinth' && secrets.MODRINTH_ESSENCE_ASCENDANCE || '' }}
          modrinth-unfeature-mode: none
          files: release/${{ matrix.target.file }}
          name: Essence Ascendance ${{ needs.build.outputs.version }} (${{ matrix.target.loader }}, Minecraft ${{ matrix.target.minecraft }})
          version: ${{ needs.build.outputs.version }}+mc${{ matrix.target.minecraft }}-${{ matrix.target.loader }}
          version-type: ${{ needs.build.outputs.release_type }}
          changelog-file: release/CHANGELOG.md
          loaders: ${{ matrix.target.loader }}
          game-versions: ${{ matrix.target.minecraft }}
          game-version-filter: releases
          environment: client | server
          java: ${{ matrix.target.java }}
          modrinth-dependencies: ${{ matrix.target.modrinthDependencies }}
          curseforge-dependencies: ${{ matrix.target.curseforgeDependencies }}
          # A lost response may mean an upload succeeded; avoid blind duplicate retries.
          retry-attempts: 1
          fail-mode: fail
