name: Configuration presets

on:
  push:
    branches: [main]
    paths:
      - 'presets/**'
      - 'tools/presets/**'
      - 'docs/wiki/Config-Presets.md'
      - 'docs/wiki/Preset-*.md'
      - '.github/workflows/config-presets.yml'
  pull_request:
    paths:
      - 'presets/**'
      - 'tools/presets/**'
      - 'docs/wiki/Config-Presets.md'
      - 'docs/wiki/Preset-*.md'
      - '.github/workflows/config-presets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test preset packaging
        run: python3 -m unittest discover -s tools/presets -p 'test_*.py'
      - name: Check downloads, checksums and wiki catalog
        run: python3 tools/presets/build.py --check
