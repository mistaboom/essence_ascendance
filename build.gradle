plugins {
    id 'dev.architectury.loom' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.3' apply false
}

apply from: 'gradle/branding.gradle'

tasks.register('assetJarInvariants') {
    group = 'verification'
    description = 'Verify every common runtime asset is packaged unchanged in both production jars.'
    dependsOn ':common:processResources', ':fabric:remapJar', ':neoforge:remapJar'
    doLast {
        def resourceRoot = project(':common').tasks.named('processResources').get().destinationDir
        def expected = [:]
        fileTree(resourceRoot).matching { include 'assets/**' }.visit { entry ->
            if (!entry.directory) expected[entry.relativePath.pathString] = entry.file
        }
        if (expected.empty) throw new GradleException('Common processed assets are missing.')
        def sourcePaths = [] as Set
        project(':common').sourceSets.main.resources.matching { include 'assets/**' }.visit { entry ->
            if (!entry.directory) sourcePaths.add(entry.relativePath.pathString)
        }
        if (sourcePaths != expected.keySet())
            throw new GradleException('Processed assets differ from current source/generated ownership: missing='
                    + (sourcePaths - expected.keySet()) + ', stale=' + (expected.keySet() - sourcePaths))
        ['fabric', 'neoforge'].each { loader ->
            def jar = project(":${loader}").tasks.named('remapJar').get().archiveFile.get().asFile
            new java.util.zip.ZipFile(jar).withCloseable { zip ->
                def names = zip.entries().collect { it.name }
                def nameCounts = names.countBy { it }
                def unexpected = names.findAll { it.startsWith('assets/essence_ascendance/')
                        && !it.endsWith('/') && !expected.containsKey(it) }
                if (!unexpected.empty) throw new GradleException("${loader}: stale/unowned runtime assets ${unexpected}")
                expected.each { name, source ->
                    if (!nameCounts.containsKey(name)) throw new GradleException("${loader}: missing runtime asset ${name}")
                    if (nameCounts[name] != 1) throw new GradleException("${loader}: duplicate runtime asset ${name}")
                    if (!java.util.Arrays.equals(source.bytes, zip.getInputStream(zip.getEntry(name)).bytes))
                        throw new GradleException("${loader}: stale runtime asset ${name}")
                }
                if (names.any { it.startsWith('art/') || it.endsWith('.bbmodel')
                        || it.contains('textures/armor/ascendance/source/')
                        || it.contains('textures/models/armor/source/') })
                    throw new GradleException("${loader}: packaged asset authoring files")
                if (!names.contains('com/mistaboom/essence_ascendance/mixin/ArmorPresentationMixin.class'))
                    throw new GradleException("${loader}: missing common armor presentation hook")
                if (names.any { it.startsWith('com/mistaboom/essence_ascendance/client/armor/ArmorOrnaments')
                        || it.startsWith('com/mistaboom/essence_ascendance/visual/ArmorVisualStyle') })
                    throw new GradleException("${loader}: obsolete floating armor ornament classes packaged")
                logger.lifecycle("${loader}: all ${expected.size()} runtime assets match processed resources; authoring files excluded")
            }
        }
    }
}

tasks.register('armorJarInvariants') {
    group = 'verification'
    description = 'Compatibility alias for the complete production asset verification.'
    dependsOn tasks.named('assetJarInvariants')
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

// Desktop developer tools must never inherit Loom or Minecraft dependencies.
configure([project(':common'), project(':fabric'), project(':neoforge')]) {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

apply from: 'gradle/pack-tester.gradle'
apply from: 'gradle/release.gradle'
