plugins {
    id 'dev.architectury.loom' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.3' apply false
}

tasks.register('armorJarInvariants') {
    group = 'verification'
    description = 'Verify both production jars contain generated armor assets and exclude authoring files.'
    dependsOn ':fabric:remapJar', ':neoforge:remapJar'
    doLast {
        def root = 'assets/essence_ascendance/'
        def tiers = ['latent', 'dormant', 'awakened', 'resonant', 'ascendant', 'transcendent']
        def pieces = ['helmet', 'chestplate', 'leggings', 'boots']
        def meshes = ['head', 'chest', 'left_arm', 'right_arm', 'left_leg', 'right_leg', 'belt', 'left_foot', 'right_foot']
        ['fabric', 'neoforge'].each { loader ->
            def jar = project(":${loader}").tasks.named('remapJar').get().archiveFile.get().asFile
            new java.util.zip.ZipFile(jar).withCloseable { zip ->
                def names = zip.entries().collect { it.name }
                def expected = pieces.collectMany { piece ->
                    (tiers + ['emission']).collect { tier -> "${root}textures/armor/ascendance/generated/${piece}_${tier}.png".toString() }
                } + meshes.collect { "${root}meshes/armor/ascendance/${it}.eamesh".toString() }
                expected.each { name ->
                    if (!names.contains(name)) throw new GradleException("${loader}: missing generated armor resource ${name}")
                    def source = project(':common').file("src/main/resources/${name}")
                    if (!java.util.Arrays.equals(source.bytes, zip.getInputStream(zip.getEntry(name)).bytes))
                        throw new GradleException("${loader}: stale generated armor resource ${name}")
                }
                if (names.any { it.startsWith('art/') || it.endsWith('.bbmodel')
                        || it.contains('textures/armor/ascendance/source/')
                        || it.contains('textures/models/armor/source/') })
                    throw new GradleException("${loader}: packaged armor authoring files")
                if (!names.contains('com/mistaboom/essence_ascendance/mixin/ArmorPresentationMixin.class'))
                    throw new GradleException("${loader}: missing common armor presentation hook")
                logger.lifecycle("${loader}: all 37 generated armor resources match source; authoring files excluded")
            }
        }
    }
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
