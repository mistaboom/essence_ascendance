plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    def optionalApi = project.targetRemap ? 'modCompileOnly' : 'compileOnly'
    def runtimeMod = project.targetRemap ? 'modImplementation' : 'implementation'
    add(optionalApi, "dev.ftb.mods:ftb-teams-fabric:${project.targetFtbTeams}") { transitive = false }
    add(optionalApi, "dev.ftb.mods:ftb-library-fabric:${project.targetFtbLibrary}") { transitive = false }
    add(runtimeMod, "net.fabricmc:fabric-loader:${project.targetFabricLoader}")
    add(runtimeMod, "net.fabricmc.fabric-api:fabric-api:${project.targetFabricApi}")
    add(runtimeMod, "dev.architectury:architectury-fabric:${project.targetArchitecturyApi}")

    // Fabric API. This is technically optional, but you probably want it anyway.

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    if (project.targetRemap)
        common(project(path: project.targetCommon.path, configuration: 'namedElements')) { transitive = false }
    else
        common(project(path: project.targetCommon.path)) { transitive = false }
    shadowBundle project(path: project.targetCommon.path, configuration: 'transformProductionFabric')
}

repositories { maven { url = 'https://maven.ftb.dev/releases' } }

loom {
    if (project.targetNativeAccess)
        accessWidenerPath = rootProject.file('common/src/main/resources/essence_ascendance.accesswidener')
    runs {
        server {
            ideConfigGenerated = false
        }
        progressionAuditServer {
            server()
            name = 'Isolated progression audit server'
            runDir 'build/progression-audit-server'
            programArg 'nogui'
            ideConfigGenerated = false
        }
        client {
            programArg "--username"
            programArg "ReedDev"

            programArg "--uuid"
            programArg "0e0b750fe8aa3304aa414466ca4fc44e"

            ideConfigGenerated = false
        }
    }
}

apply from: rootProject.file('gradle/team-development.gradle')

processResources {
    def metadata = [version: project.version,
                    fabric_loader_requirement: ">=${project.targetFabricLoader}",
                    minecraft_requirement: project.targetMinecraft,
                    java_requirement: ">=${project.targetJava}",
                    architectury_requirement: ">=${project.targetArchitecturyApi}"]
    inputs.properties(metadata)

    // Fabric resolves the declared access widener inside this mod's resource root.
    // Pointing Loom at common's source file alone does not copy it for dev launches.
    inputs.property 'nativeAccess', project.targetNativeAccess
    if (project.targetNativeAccess) from(loom.accessWidenerPath)

    filesMatching('fabric.mod.json') {
        expand metadata
    }
    if (!project.targetNativeAccess) {
        // The widened 1.21.1 trade classes no longer exist, and Projectile's
        // constructor is public in official 26.1.2. Do not declare a stale AW.
        doLast {
            def metadataFile = new File(destinationDir, 'fabric.mod.json')
            def metadataJson = new groovy.json.JsonSlurper().parse(metadataFile)
            metadataJson.remove('accessWidener')
            metadataFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadataJson)) + '\n'
        }
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'

    // common also contributes this same file when bundled into the production jar.
    filesMatching('essence_ascendance.accesswidener') {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

if (project.targetRemap) {
    remapJar {
        inputFile.set shadowJar.archiveFile
    }
} else {
    shadowJar.archiveClassifier = ''
    jar.archiveClassifier = 'dev'
    tasks.named('build') { dependsOn tasks.named('shadowJar') }
}

repositories { maven { url = 'https://chocolateminecraft.com/maven' } }
