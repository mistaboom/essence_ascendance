if (gradle.ext.has('essenceNativeFixture')) throw new GradleException('Run one native fixture init script per Gradle invocation')
gradle.ext.essenceNativeFixture = 'projectile'
// Explicit no-world tests: -I gradle/projectile-native-hooks.init.gradle :fabric:1.21.1:runServer or :neoforge:1.21.1:runClient.
// Fabric exits at server initialization with --initSettings as a second guard.
// NeoForge loads its fixture during client setup and exits before a menu or world.
allprojects { p ->
    p.afterEvaluate {
        if (!p.rootProject.ext.has('nativeFixtureSelection'))
            p.rootProject.apply from: p.rootProject.file('gradle/native-fixture-selection.gradle')
        def selection = p.rootProject.nativeFixtureSelection
        if (p.path != selection.projectPath) return
        def requestedTasks = selection.taskPaths
        def modern = p.targetResourceFormat == '26.1'
        if (p.parent.name == 'fabric' && modern) {
            def common = p.targetCommon
            def metadata = p.file('build/native-fixtures/projectile-fabric2612-metadata')
            def compile = p.tasks.register('compileProjectileFabric2612Fixture', JavaCompile) {
                dependsOn(common.tasks.named('testClasses'), p.tasks.named('classes'))
                source(p.rootProject.file('gradle/native-fixtures/FabricProjectileNativeMod2612.java'))
                classpath = p.sourceSets.main.compileClasspath + p.sourceSets.main.output + common.sourceSets.test.output
                destinationDirectory = p.layout.buildDirectory.dir('native-fixtures/projectile-fabric2612-classes')
                options.release = p.targetJava
                javaCompiler = p.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(p.targetJava) }
            }
            def fixture = p.tasks.register('projectileFabric2612FixtureJar', Jar) {
                dependsOn(compile)
                archiveFileName = 'projectile-fabric2612-fixture.jar'
                destinationDirectory = p.layout.buildDirectory.dir('native-fixtures')
                from(compile.flatMap { it.destinationDirectory })
                from(common.sourceSets.test.output) {
                    include 'com/mistaboom/essence_ascendance/projectile/ProjectileNativeServerFixture2612.class'
                }
                from(metadata)
                doFirst {
                    metadata.mkdirs()
                    new File(metadata, 'fabric.mod.json').text = '''{"schemaVersion":1,"id":"essence_projectile_fabric2612_test","version":"1","environment":"server","entrypoints":{"main":["com.mistaboom.essence_ascendance.fixture.FabricProjectileNativeMod2612"]},"depends":{"essence_ascendance":"*"}}'''
                }
            }
            p.tasks.named('runServer').configure { t ->
                def run = p.file('build/native-fixtures/projectile-fabric2612-run').canonicalFile
                t.internalRunDir.set(run)
                t.jvmArgs('-Dfabric.addMods=' + p.file('build/native-fixtures/projectile-fabric2612-fixture.jar').canonicalPath)
                t.dependsOn(fixture)
                t.doFirst {
                    if (t.internalRunDir.asFile.get().canonicalFile != run) throw new GradleException('Unexpected Fabric projectile fixture directory')
                    run.mkdirs()
                    new File(run, 'eula.txt').text = 'eula=true\n'
                }
            }
        }
        if (p.parent.name == 'fabric' && !modern) {
            def fixtureMetadata = p.file('build/native-fixtures/projectile-hook-metadata')
            def hookJar = p.tasks.register('projectileHookFixtureJar', Jar) {
                dependsOn(p.targetCommon.tasks.named('testClasses'))
                archiveFileName = 'projectile-hook-fixture.jar'
                destinationDirectory = p.layout.buildDirectory.dir('native-fixtures')
                from(p.targetCommon.sourceSets.test.output) {
                    include 'com/mistaboom/essence_ascendance/projectile/ProjectileNativeHookTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/ProjectileNativeInterceptionTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeGuardCounterattackTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeGuardRamTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeGuardOutcomeTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeGuardExplosionTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeStatusInterceptionTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativePostureOutcomeTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeCombatHudTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeVitalityRecoveryTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeResourceChainsTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeSalvageTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeCarrierCompatibilityTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeMeleeBonusTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeGlaiveFoundationTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeGlaiveActionTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeGlaivePresentationTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeTwoHandedEquipmentTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeToolInstinctTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeFishingRodTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativePersonalizedEquipmentTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeVitalitySustenanceTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeOreSurveyTest*.class'
                    include 'com/mistaboom/essence_ascendance/verification/*.class'
                }
                from(fixtureMetadata)
                doFirst {
                    fixtureMetadata.mkdirs()
                    new File(fixtureMetadata, 'fabric.mod.json').text = '''{"schemaVersion":1,"id":"essence_projectile_hook_test","version":"1","environment":"server","entrypoints":{"server":["com.mistaboom.essence_ascendance.projectile.ProjectileNativeHookTest::runAndExit"]},"depends":{"essence_ascendance":"*"}}'''
                }
            }
            p.tasks.named('runServer').configure { t ->
                def testRun = p.file('build/native-fixtures/projectile-native-hooks-run').canonicalFile
                t.internalRunDir.set(testRun)
                t.args('--initSettings', '--nogui')
                t.jvmArgs('-Dfabric.addMods=' + p.file('build/native-fixtures/projectile-hook-fixture.jar').canonicalPath,
                        '-Dessence.projectile.nativeHookTest=true')
                t.dependsOn(hookJar)
                t.doFirst {
                    if (t.internalRunDir.asFile.get().canonicalFile != testRun) throw new GradleException('Unexpected hook test directory')
                    testRun.mkdirs()
                }
            }
        }
        if (p.parent.name == 'neoforge') {
            def common = p.rootProject.project(":common:${p.targetMinecraft}")
            def commonFixture = null
            if (!modern) p.tasks.named('runServer').configure {
                doFirst { throw new GradleException("Use ${p.path}:runClient for the initialization-only native fixture; server settings initialization exits before mod setup.") }
            }
            // NeoForge modules reject split packages. Add package-private native probes to
            // the common development module for this explicit fixture run only.
            if (requestedTasks.any { it == "${p.path}:runClient" ||
                    (modern && it == "${p.path}:runServer") }) {
                p.apply from: p.rootProject.file('gradle/native-fixture-support.gradle')
                commonFixture = p.useNativeFixtureCommon('projectile', [
                        'com/mistaboom/essence_ascendance/projectile/*Native*.class',
                        'com/mistaboom/essence_ascendance/verification/*.class'
                ])
            }
            def metadata = p.file('build/native-fixtures/defense-native-neo-metadata')
            def compile = p.tasks.register('compileDefenseNativeFixture', JavaCompile) {
                dependsOn(common.tasks.named('testClasses'))
                source(p.rootProject.file(modern ? 'gradle/native-fixtures/DefenseNativeMod2612.java' : 'gradle/native-fixtures/DefenseNativeMod.java'))
                classpath = p.sourceSets.main.compileClasspath + common.sourceSets.test.output
                destinationDirectory = p.layout.buildDirectory.dir('native-fixtures/defense-native-neo-classes')
                options.release = p.targetJava
                javaCompiler = p.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(p.targetJava) }
            }
            def fixture = p.tasks.register('defenseNativeFixtureJar', Jar) {
                dependsOn(compile)
                archiveFileName = 'defense-native-neo-fixture.jar'
                destinationDirectory = p.layout.buildDirectory.dir('native-fixtures')
                from(compile.flatMap { it.destinationDirectory }) {
                    include modern ? 'com/mistaboom/essence_ascendance/fixture/DefenseNativeMod2612.class'
                            : 'com/mistaboom/essence_ascendance/fixture/DefenseNativeMod.class'
                }
                from(metadata)
                doFirst {
                    new File(metadata, 'META-INF').mkdirs()
                    new File(metadata, 'META-INF/neoforge.mods.toml').text = '''modLoader="javafml"
loaderVersion="[4,)"
license="All Rights Reserved"
[[mods]]
modId="essence_defense_native_test"
version="1"
displayName="No-world Defense fixture"
[[dependencies.essence_defense_native_test]]
modId="essence_ascendance"
type="required"
versionRange="[1.0.0-beta.1,)"
ordering="AFTER"
side="CLIENT"
'''
                }
            }
            if (modern) {
                def serverMetadata = p.file('build/native-fixtures/defense-native-neo-server-metadata')
                def serverCompile = p.tasks.register('compileDefenseNativeServerFixture', JavaCompile) {
                    dependsOn(common.tasks.named('testClasses'))
                    source(p.rootProject.file('gradle/native-fixtures/DefenseNativeServerMod2612.java'))
                    classpath = p.sourceSets.main.compileClasspath + common.sourceSets.test.output
                    destinationDirectory = p.layout.buildDirectory.dir('native-fixtures/defense-native-neo-server-classes')
                    options.release = p.targetJava
                    javaCompiler = p.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(p.targetJava) }
                }
                def serverFixture = p.tasks.register('defenseNativeServerFixtureJar', Jar) {
                    dependsOn(serverCompile)
                    archiveFileName = 'defense-native-neo-server-fixture.jar'
                    destinationDirectory = p.layout.buildDirectory.dir('native-fixtures')
                    from(serverCompile.flatMap { it.destinationDirectory })
                    from(serverMetadata)
                    doFirst {
                        new File(serverMetadata, 'META-INF').mkdirs()
                        new File(serverMetadata, 'META-INF/neoforge.mods.toml').text = '''modLoader="javafml"
loaderVersion="[4,)"
license="All Rights Reserved"
[[mods]]
modId="essence_defense_native_server_test"
version="1"
displayName="Registry-bound Defense fixture"
[[dependencies.essence_defense_native_server_test]]
modId="essence_ascendance"
type="required"
versionRange="[1.0.0-beta.1,)"
ordering="AFTER"
side="SERVER"
'''
                    }
                }
                p.tasks.named('runServer').configure { t ->
                    def testRun = p.file('build/native-fixtures/defense-native-server-neoforge-run').canonicalFile
                    t.internalRunDir.set(testRun)
                    t.dependsOn(serverFixture, commonFixture)
                    def originalCommon = common.tasks.named('jar').get().archiveFile.get().asFile.canonicalFile
                    def originalClasspath = t.classpath.files.findAll { it.canonicalFile != originalCommon }
                    t.classpath = p.files(originalClasspath, commonFixture.flatMap { it.archiveFile })
                    t.doFirst {
                        def actual = t.classpath.files*.canonicalFile
                        def fixtureCommonFile = commonFixture.get().archiveFile.get().asFile.canonicalFile
                        if (!actual.contains(fixtureCommonFile) || actual.contains(originalCommon))
                            throw new GradleException('Projectile server fixture common classes are not isolated')
                        testRun.mkdirs()
                        new File(testRun, 'eula.txt').text = 'eula=true\n'
                        def mods = new File(testRun, 'mods'); mods.mkdirs()
                        p.copy { from(serverFixture.get().archiveFile); into(mods) }
                    }
                }
            }
            p.tasks.named('runClient').configure { t ->
                def testRun = p.file('build/native-fixtures/defense-native-neoforge-run').canonicalFile
                t.internalRunDir.set(testRun)
                t.jvmArgs('-Dessence.projectile.nativeHookTest=true')
                t.dependsOn(fixture)
                if (commonFixture != null && modern) {
                    t.dependsOn(commonFixture)
                    def originalCommon = common.tasks.named('jar').get().archiveFile.get().asFile.canonicalFile
                    def originalClasspath = t.classpath.files.findAll { it.canonicalFile != originalCommon }
                    t.classpath = p.files(originalClasspath, commonFixture.flatMap { it.archiveFile })
                }
                t.doFirst {
                    if (commonFixture != null && modern) {
                        def actual = t.classpath.files*.canonicalFile
                        def fixtureCommonFile = commonFixture.get().archiveFile.get().asFile.canonicalFile
                        def originalCommonFile = common.tasks.named('jar').get().archiveFile.get().asFile.canonicalFile
                        if (!actual.contains(fixtureCommonFile) || actual.contains(originalCommonFile))
                            throw new GradleException('Projectile fixture common classes are not isolated on the client classpath')
                        new java.util.jar.JarFile(fixtureCommonFile).withCloseable { jar ->
                            if (jar.getEntry('com/mistaboom/essence_ascendance/projectile/ProjectileNativeHookTest.class') == null)
                                throw new GradleException('Projectile fixture entrypoint is absent from the fixture common jar')
                        }
                    }
                    if (t.internalRunDir.asFile.get().canonicalFile != testRun) throw new GradleException('Unexpected Defense test directory')
                    def dataJar = common.sourceSets.main.compileClasspath.files.find { file ->
                        if (!file.isFile() || !file.name.endsWith('.jar')) return false
                        new java.util.zip.ZipFile(file).withCloseable { zip ->
                            zip.getEntry('data/minecraft/loot_table/blocks/potatoes.json') != null
                        }
                    }
                    if (dataJar == null) throw new GradleException('Native resource-chain fixture needs Minecraft data from its resolved dependency')
                    t.jvmArgs('-Dessence.native.vanillaDataJar=' + dataJar.canonicalPath)
                    new File(testRun, 'mods').mkdirs()
                    p.copy { from(fixture.get().archiveFile); into(new File(testRun, 'mods')) }
                }
            }
        }
    }
}
