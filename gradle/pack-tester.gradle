// The handoff uses the task's declared archive provider, never a directory glob.
['fabric', 'neoforge'].each { loader ->
    tasks.register("packTester${loader.capitalize()}Artifact") {
        group = 'development tools'
        description = "Build only the ${loader} production archive and write a private Pack Tester receipt."
        dependsOn ":${loader}:remapJar"
        doLast {
            def request = providers.gradleProperty('packTesterRequest').orNull
            if (request == null || !(request ==~ /[0-9a-f-]{36}/))
                throw new GradleException('Pack Tester requires a UUID packTesterRequest.')
            def archive = project(":${loader}").tasks.named('remapJar').get().archiveFile.get().asFile
            def receipt = file(".pack-tester/results/${request}.json")
            receipt.parentFile.mkdirs()
            receipt.text = groovy.json.JsonOutput.toJson([
                request: request, loader: loader, minecraft: rootProject.minecraft_version,
                archive: archive.canonicalPath,
                sha256: java.security.MessageDigest.getInstance('SHA-256').digest(archive.bytes).encodeHex().toString()
            ])
        }
    }
}
