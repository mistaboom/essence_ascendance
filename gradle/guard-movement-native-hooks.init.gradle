if (gradle.ext.has('essenceNativeFixture')) throw new GradleException('Run one native fixture init script per Gradle invocation')
gradle.ext.essenceNativeFixture = 'guard-movement'
// Explicit isolated client initialization test. Test entrypoint exits before any menu/world is opened.
def jeiFixturePath = gradle.startParameter.projectProperties['jeiFixtureJar']
def jeiFixtureJar = gradle.startParameter.projectProperties.containsKey('jeiFixtureJar') ? new File(jeiFixturePath).canonicalFile : null
if (jeiFixtureJar != null && (!new File(jeiFixturePath).isAbsolute() || !jeiFixtureJar.isFile()))
    throw new GradleException('jeiFixtureJar must name an existing absolute JEI jar path')
def jeiRunSuffix = jeiFixtureJar == null ? '' : '-' + jeiFixtureJar.name.replaceAll('[^a-zA-Z0-9._-]', '-')
allprojects { p ->
    p.afterEvaluate {
        if (!p.rootProject.ext.has('nativeFixtureSelection'))
            p.rootProject.apply from: p.rootProject.file('gradle/native-fixture-selection.gradle')
        if (p.path != p.rootProject.nativeFixtureSelection.projectPath) return
        if (p.parent.name == 'fabric') {
            def common = p.rootProject.project(":common:${p.targetMinecraft}")
            def metadata = p.file('build/native-fixtures/guard-movement-hook-metadata')
            def fixture = p.tasks.register('guardMovementHookFixtureJar', Jar) {
                dependsOn(common.tasks.named('testClasses'))
                archiveFileName = 'guard-movement-hook-fixture.jar'
                destinationDirectory = p.layout.buildDirectory.dir('native-fixtures')
                from(common.sourceSets.test.output) {
                    include 'com/mistaboom/essence_ascendance/fixture/GuardMovementNativeTest*.class'
                }
                from(metadata)
                doFirst {
                    metadata.mkdirs()
                    new File(metadata, 'fabric.mod.json').text = '''{"schemaVersion":1,"id":"essence_guard_movement_hook_test","version":"1","environment":"client","entrypoints":{"client":["com.mistaboom.essence_ascendance.fixture.GuardMovementNativeTest::runAndExit"]},"depends":{"essence_ascendance":"*"}}'''
                }
            }
            p.tasks.named('runClient').configure { t ->
                def testRun = p.file('build/native-fixtures/guard-movement-native-hooks-run' + jeiRunSuffix).canonicalFile
                t.internalRunDir.set(testRun)
                def addedMods = [p.file('build/native-fixtures/guard-movement-hook-fixture.jar').canonicalFile]
                if (jeiFixtureJar != null) addedMods.add(jeiFixtureJar)
                t.jvmArgs('-Dfabric.addMods=' + addedMods.collect { it.path }.join(File.pathSeparator),
                        '-Dessence.guard.movementNativeTest=true', '-Dessence.guard.fixtureLoader=fabric')
                if (jeiFixtureJar != null) t.jvmArgs('-Dessence.guard.requireJei=true')
                t.dependsOn(fixture)
                t.doFirst {
                    if (t.internalRunDir.asFile.get().canonicalFile != testRun) throw new GradleException('Unexpected movement test directory')
                    testRun.mkdirs()
                    if (jeiFixtureJar != null) p.logger.lifecycle('Required Fabric JEI fixture: ' + jeiFixtureJar)
                }
            }
        }
        if (p.parent.name == 'neoforge') {
            def common = p.rootProject.project(":common:${p.targetMinecraft}")
            def metadata = p.file('build/native-fixtures/guard-movement-neo-hook-metadata')
            def compile = p.tasks.register('compileGuardMovementNeoFixture', JavaCompile) {
                dependsOn(common.tasks.named('testClasses'))
                source(p.rootProject.file('gradle/native-fixtures/GuardMovementNativeMod.java'))
                classpath = p.sourceSets.main.compileClasspath + common.sourceSets.test.output
                destinationDirectory = p.layout.buildDirectory.dir('native-fixtures/guard-movement-neo-hook-classes')
                options.release = p.targetJava
                javaCompiler = p.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(p.targetJava) }
            }
            def fixture = p.tasks.register('guardMovementNeoHookFixtureJar', Jar) {
                dependsOn(compile)
                archiveFileName = 'guard-movement-neo-hook-fixture.jar'
                destinationDirectory = p.layout.buildDirectory.dir('native-fixtures')
                from(common.sourceSets.test.output) {
                    include 'com/mistaboom/essence_ascendance/fixture/GuardMovementNativeTest*.class'
                }
                from(compile.flatMap { it.destinationDirectory })
                from(metadata)
                doFirst {
                    new File(metadata, 'META-INF').mkdirs()
                    new File(metadata, 'META-INF/neoforge.mods.toml').text = '''modLoader="javafml"
loaderVersion="[4,)"
license="All Rights Reserved"
[[mods]]
modId="essence_guard_movement_hook_test"
version="1"
displayName="No-world guard movement fixture"
[[dependencies.essence_guard_movement_hook_test]]
modId="essence_ascendance"
type="required"
versionRange="[1.0.0-beta.1,)"
ordering="AFTER"
side="CLIENT"
'''
                }
            }
            p.tasks.named('runClient').configure { t ->
                def testRun = p.file('build/native-fixtures/guard-movement-native-hooks-neoforge-run' + jeiRunSuffix).canonicalFile
                t.internalRunDir.set(testRun)
                t.jvmArgs('-Dessence.guard.movementNativeTest=true', '-Dessence.guard.fixtureLoader=neoforge')
                if (jeiFixtureJar != null) t.jvmArgs('-Dessence.guard.requireJei=true')
                t.dependsOn(fixture)
                t.doFirst {
                    if (t.internalRunDir.asFile.get().canonicalFile != testRun) throw new GradleException('Unexpected NeoForge movement test directory')
                    new File(testRun, 'mods').mkdirs()
                    p.copy { from(fixture.get().archiveFile); into(new File(testRun, 'mods')) }
                    if (jeiFixtureJar != null) {
                        p.logger.lifecycle('Required NeoForge JEI fixture: ' + jeiFixtureJar)
                        p.copy { from(jeiFixtureJar); into(new File(testRun, 'mods')) }
                    }
                }
            }
        }
    }
}
