// Applied by :common. Art sources have one importer and one build-owned output tree.
def artDirectory = rootProject.file('art')
def generatedAssetResources = layout.buildDirectory.dir('generated-resources/assets')
def assetWorkDirectory = layout.buildDirectory.dir('asset-work')
def assetPipelineClasses = layout.buildDirectory.dir('asset-pipeline/classes')
def assetSupportSources = sourceSets.main.java.matching {
    include 'com/mistaboom/essence_ascendance/equipment/personalized/PersonalizedEquipmentDefinition.java'
    include 'com/mistaboom/essence_ascendance/visual/CanonicalPaletteValues.java'
    include 'com/mistaboom/essence_ascendance/visual/TexturePixels.java'
}
def profileResourcePath = 'data/essence_ascendance/personalized_equipment.json'
// The active Stonecutter node reads its shared authored resources directly;
// other nodes read generated resources. Select the root declared in this node's
// source set before files exist, never whichever old file happens to be on disk.
def targetProfiles = tasks.named('stonecutterGenerate', Sync).map {
    def sharedRoots = [rootProject.file('common/src/main/resources').canonicalFile,
                       new File(it.destinationDir, 'resources').canonicalFile]
    def selectedRoots = sourceSets.main.resources.srcDirs.collect { it.canonicalFile }.findAll { it in sharedRoots }
    if (selectedRoots.size() != 1)
        throw new GradleException("Expected one Stonecutter-declared shared resource root for ${project.path}, got ${selectedRoots}")
    new File(selectedRoots.first(), profileResourcePath)
}
def profileResourceOwners = sourceSets.main.resources.matching { include profileResourcePath }
def assetPipelineSources = files(
        rootProject.file('tools/AssetPipeline.java'),
        rootProject.file('tools/BlockbenchSource.java'),
        rootProject.file('tools/BlockbenchMeshExporter.java'),
        rootProject.file('tools/AscendanceArmorGenerator.java'),
        rootProject.file('tools/EssenceBlockTextureGenerator.java'),
        rootProject.file('tools/MaskedTextureWriter.java'), assetSupportSources)

tasks.register('compileAssetPipeline', JavaCompile) {
    dependsOn tasks.named('stonecutterGenerate')
    group = 'asset pipeline'
    description = 'Compiles the shared Blockbench import and texture baking tools.'
    source = assetPipelineSources
    destinationDirectory = assetPipelineClasses
    classpath = configurations.compileClasspath
    options.release = 21
}

def generateAssets = tasks.register('generateAssets', JavaExec) {
    group = 'asset pipeline'
    description = 'Imports current art sources and generates all runtime textures, models and meshes.'
    dependsOn tasks.named('compileAssetPipeline')
    classpath = files(assetPipelineClasses) + configurations.compileClasspath
    mainClass = 'AssetPipeline'
    inputs.files(fileTree(artDirectory) { include 'asset-manifest.json', 'source/models/**/*.bbmodel' })
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(assetPipelineSources).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(targetProfiles)
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(profileResourceOwners).withPropertyName('profileResourceOwners')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property 'resourceFormat', project.targetResourceFormat
    if (project.targetResourceFormat == '26.1')
        inputs.files(fileTree(rootProject.file('common/src/main/resources/assets/essence_ascendance/models/item')) {
            include '*.json'
        }).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dirs(generatedAssetResources, assetWorkDirectory)
    doFirst {
        def expectedProfile = targetProfiles.get().canonicalFile
        def owners = sourceSets.main.resources.srcDirs.collect {
            new File(it, profileResourcePath).canonicalFile
        }.findAll { it.isFile() }
        if (owners != [expectedProfile])
            throw new GradleException("Expected only the Stonecutter-selected profile ${expectedProfile}, got ${owners}")
        setArgs([artDirectory.absolutePath, layout.buildDirectory.get().asFile.absolutePath, generatedAssetResources.get().asFile.absolutePath,
                 assetWorkDirectory.get().asFile.absolutePath, targetProfiles.get().absolutePath,
                 project.targetResourceFormat, rootProject.file('common/src/main/resources').absolutePath])
    }
}

sourceSets.main.resources.srcDir(generatedAssetResources)
sourceSets.main.resources.exclude('**/*.bbmodel', '**/textures/armor/ascendance/source/**',
        '**/textures/models/armor/source/**')

def assetOwnershipInvariants = tasks.register('assetOwnershipInvariants') {
    group = 'verification'
    description = 'Rejects runtime resources supplied by both generated assets and checked-in resources.'
    dependsOn generateAssets
    inputs.files(sourceSets.main.resources).withPathSensitivity(PathSensitivity.RELATIVE)
    doLast {
        def generatedRoot = generatedAssetResources.get().asFile.canonicalFile
        def authoredRoots = sourceSets.main.resources.srcDirs.findAll { it.canonicalFile != generatedRoot }
        def collisions = []
        fileTree(generatedRoot).visit { entry ->
            if (!entry.directory) {
                def relative = entry.relativePath.pathString
                authoredRoots.each { sourceRoot ->
                    if (new File(sourceRoot, relative).exists()) collisions.add(relative)
                }
            }
        }
        if (!collisions.empty) {
            throw new GradleException('Assets must have one owner. Remove checked-in copies of generated resources:\n'
                    + collisions.unique().sort().join('\n'))
        }
    }
}

tasks.named('processResources') {
    dependsOn 'stonecutterGenerate', generateAssets, assetOwnershipInvariants
    duplicatesStrategy = DuplicatesStrategy.FAIL
}
tasks.named('sourcesJar') {
    dependsOn 'stonecutterGenerate', generateAssets, assetOwnershipInvariants
    duplicatesStrategy = DuplicatesStrategy.FAIL
}
tasks.named('check') {
    def assetGateSuffix = project.targetMinecraft.replaceAll('[^0-9]', '')
    def versionTargets = rootProject.targetCatalog.targets.findAll { it.minecraft == project.targetMinecraft }
    // A common check audits both production archives for this Minecraft version.
    def packagedAssetGates = versionTargets.every { it.implemented }
            ? [":assetJarInvariants${assetGateSuffix}"]
            : versionTargets.findAll { it.implemented }.collect { ":assetJarInvariants${it.id}" }
    dependsOn assetOwnershipInvariants, 'assetPipelineInvariants', packagedAssetGates
}

def assetPipelineTestClasses = layout.buildDirectory.dir('asset-pipeline/test-classes')
tasks.register('compileAssetPipelineTests', JavaCompile) {
    dependsOn tasks.named('compileAssetPipeline')
    source = rootProject.files('tools/AssetPipelineTest.java')
    destinationDirectory = assetPipelineTestClasses
    classpath = files(assetPipelineClasses) + configurations.compileClasspath
    options.release = 21
}
tasks.register('assetPipelineInvariants', JavaExec) {
    group = 'verification'
    description = 'Checks source edits, deterministic exports, stitched shield geometry/materials and failed-import isolation.'
    dependsOn tasks.named('compileAssetPipelineTests'), generateAssets
    classpath = files(assetPipelineTestClasses, assetPipelineClasses) + configurations.compileClasspath
    mainClass = 'AssetPipelineTest'
    doFirst {
        setArgs([layout.buildDirectory.dir('asset-pipeline-tests').get().asFile.absolutePath,
                 artDirectory.absolutePath, generatedAssetResources.get().asFile.absolutePath, targetProfiles.get().absolutePath])
    }
}

// Existing developer commands now use the same import and generation path as ordinary builds.
['compileEssenceBlockTextureGenerator', 'compileAscendanceArmorGenerator', 'compileAscendanceHelmetGenerator'].each { name ->
    tasks.register(name) {
        group = 'asset pipeline'
        description = 'Compatibility alias for compileAssetPipeline.'
        dependsOn tasks.named('compileAssetPipeline')
    }
}
['generateEssenceBlockTextures', 'generateAscendanceArmor', 'generateAscendanceHelmet', 'importAscendanceArmorTextures'].each { name ->
    tasks.register(name) {
        group = 'asset pipeline'
        description = 'Compatibility alias for generateAssets; authoring sources remain under art/.'
        dependsOn generateAssets
    }
}
