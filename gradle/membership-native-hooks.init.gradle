// Explicit isolated headless/no-world optional-loading checks. No EULA acceptance or live mods-folder changes.
// Run -I gradle/membership-native-hooks.init.gradle :fabric:runServer or :neoforge:runServer.
// Add -PmembershipFixtureFtb=true for the exact verified binaries under build/ftb-stage3-verification.
// Library 2101.1.36/37 use checksummed build/ftb-shared-compat-audit binaries.
allprojects { p ->
    p.afterEvaluate {
        if (!(p.path in [':fabric', ':neoforge'])) return
        def enabled = p.rootProject.findProperty('membershipFixtureFtb') == 'true'
        def libraryVersion = p.rootProject.findProperty('membershipFixtureFtbLibraryVersion') ?: '2101.1.30'
        if (!(libraryVersion in ['2101.1.30', '2101.1.36', '2101.1.37']))
            throw new GradleException('Membership fixture requires an audited Library version')
        def mode = enabled ? 'ftb-' + libraryVersion : 'absent'
        def common = p.rootProject.project(':common')
        def testRun = p.rootProject.file("build/membership-native-${p.name}-${mode}-run").canonicalFile
        def metadata = p.rootProject.file("build/membership-fixture-${p.name}-metadata")
        def fixture = p.tasks.register('membershipNativeFixtureJar', Jar) {
            dependsOn(common.tasks.named('testClasses'))
            archiveFileName = "membership-${p.name}-fixture.jar"
            destinationDirectory = p.rootProject.layout.buildDirectory
            if (p.path == ':fabric') {
                from(common.sourceSets.test.output) { include 'com/mistaboom/essence_ascendance/team/MembershipNativeHookTest*.class' }
                from(common.sourceSets.test.output) { include 'com/mistaboom/essence_ascendance/team/compat/FtbTeamsApiBoundaryTest*.class' }
                from(common.sourceSets.test.output) { include 'com/mistaboom/essence_ascendance/team/MembershipProviderTest*.class' }
                from(common.sourceSets.test.output) {
                    include 'com/mistaboom/essence_ascendance/projectile/NativeMachineBindingTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeSinglePlayerChannelTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeAutomatedItemOwnershipTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeInfuserStartTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeFishingRodTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/ProjectileNativeInterceptionTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeGuardOutcomeTest*.class'
                }
            }
            from(metadata)
            doFirst {
                metadata.mkdirs()
                if (p.path == ':fabric') {
                    new File(metadata, 'fabric.mod.json').text = '''{"schemaVersion":1,"id":"essence_membership_test","version":"1","environment":"server","entrypoints":{"server":["com.mistaboom.essence_ascendance.team.MembershipNativeHookTest::runAndExit"]},"depends":{"essence_ascendance":"*"}}'''
                } else {
                    new File(metadata, 'META-INF').mkdirs()
                    new File(metadata, 'META-INF/neoforge.mods.toml').text = '''modLoader="javafml"
loaderVersion="[4,)"
license="All Rights Reserved"
[[mods]]
modId="essence_membership_test"
version="1"
displayName="No-world membership fixture"
[[dependencies.essence_membership_test]]
modId="essence_ascendance"
type="required"
versionRange="[1.0.0-beta.1,)"
ordering="AFTER"
side="SERVER"
'''
                }
            }
        }
        if (p.path == ':neoforge' && p.gradle.startParameter.taskNames.any { it == ':neoforge:runServer' }) {
            // Avoid NeoForge split packages; fixture test lives in common only for this explicit run.
            common.tasks.named('jar').configure {
                dependsOn(common.tasks.named('testClasses'))
                from(common.sourceSets.test.output) { include 'com/mistaboom/essence_ascendance/team/MembershipNativeHookTest*.class' }
                from(common.sourceSets.test.output) { include 'com/mistaboom/essence_ascendance/team/compat/FtbTeamsApiBoundaryTest*.class' }
                from(common.sourceSets.test.output) { include 'com/mistaboom/essence_ascendance/team/MembershipProviderTest*.class' }
                from(common.sourceSets.test.output) {
                    include 'com/mistaboom/essence_ascendance/projectile/NativeMachineBindingTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeSinglePlayerChannelTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeAutomatedItemOwnershipTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeInfuserStartTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeFishingRodTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/ProjectileNativeInterceptionTest*.class'
                    include 'com/mistaboom/essence_ascendance/projectile/NativeGuardOutcomeTest*.class'
                }
            }
            def compile = p.tasks.register('compileMembershipNativeFixture', JavaCompile) {
                source(p.rootProject.file('gradle/native-fixtures/MembershipNativeMod.java'))
                classpath = p.sourceSets.main.compileClasspath
                destinationDirectory = p.rootProject.layout.buildDirectory.dir('membership-native-neo-classes')
                options.release = 21
            }
            fixture.configure { dependsOn(compile); from(compile.flatMap { it.destinationDirectory }) }
        }
        p.tasks.named('runServer').configure { t ->
            t.internalRunDir.set(testRun)
            t.jvmArgs('-Dessence.membership.expectFtb=' + enabled)
            t.dependsOn(fixture)
            if (p.path == ':fabric') t.args('--initSettings')
            t.doFirst {
                if (t.internalRunDir.asFile.get().canonicalFile != testRun) throw new GradleException('Unexpected membership test directory')
                testRun.mkdirs()
                def providerJars = enabled ? [
                        p.rootProject.file("build/ftb-stage3-verification/ftb-teams-${p.name}-2101.1.11.jar").canonicalFile,
                        p.rootProject.file("build/${libraryVersion == '2101.1.30' ? 'ftb-stage3-verification' : 'ftb-shared-compat-audit'}/ftb-library-${p.name}-${libraryVersion}.jar").canonicalFile
                ] : []
                if (providerJars.any { !it.isFile() }) throw new GradleException('Missing verified no-world FTB test binaries')
                if (p.path == ':fabric') {
                    t.jvmArgs('-Dfabric.addMods=' + ([fixture.get().archiveFile.get().asFile.canonicalFile] + providerJars).collect { it.path }.join(File.pathSeparator))
                } else {
                    def mods = new File(testRun, 'mods'); mods.mkdirs()
                    p.copy { from(fixture.get().archiveFile); from(providerJars); into(mods) }
                }
            }
        }
    }
}
