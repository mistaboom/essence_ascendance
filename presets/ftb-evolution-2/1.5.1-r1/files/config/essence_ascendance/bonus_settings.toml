id = "essence_ascendance:guard_readiness"
min_tier = "essence_ascendance:dormant"
max_tier = "essence_ascendance:ascendant"
bonus_at_max = 80.0
minimum_bonus_at_lowest = 10.0

[[bonus]]
# Retain the full native blocking-slowdown removal ceiling at Transcendent. A five-stage Mobility investment supports shield builds without exceeding ordinary movement speed by itself.
id = "essence_ascendance:guarded_movement"
min_tier = "essence_ascendance:dormant"
max_tier = "essence_ascendance:transcendent"
bonus_at_max = 100.0
minimum_bonus_at_lowest = 10.0

[[bonus]]
# Lower and postpone broad healing amplification because BHC patches, Apotheosis healing/lifesteal and other external heals can stack. Forty percent stays relevant without multiplying every strong external heal by 1.52 early.
