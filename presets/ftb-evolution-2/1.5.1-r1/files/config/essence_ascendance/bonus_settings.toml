# FTB Evolution 2 1.5.1 - Essence Ascendance pack balance proposal
# Solo Normal, automation expected, competitive parallel progression.
# Apply with /essence admin balance rebuild; saved JSON is output only.
# All 41 Bonus tracks individually reviewed. See bonus-audit.json.
schema_version = 1

[[bonus]]
# Retain a useful native-anvil discount, but spread it across four stages. Apotheosis augmenting uses a separate table and its 175/225 level costs are not reduced by this Bonus.
id = "essence_ascendance:anvil_efficiency"
min_tier = "essence_ascendance:dormant"
max_tier = "essence_ascendance:ascendant"
bonus_at_max = 50.0
minimum_bonus_at_lowest = 10.0

[[bonus]]
# Reduce end knockback from 104% to 60%; melee control stays helpful without repeatedly driving targets out of short-range combos. Players can stop investing earlier.
id = "essence_ascendance:attack_knockback"
min_tier = "essence_ascendance:dormant"
max_tier = "essence_ascendance:ascendant"
bonus_at_max = 60.0
minimum_bonus_at_lowest = 10.0

[[bonus]]
# Bring underwater convenience forward to exploration while Just Dire waterbreathing and later EA aquatic skills offer full solutions. Sixty seconds is a useful reserve, not infinite air.
id = "essence_ascendance:breath_hold"
min_tier = "essence_ascendance:awakened"
max_tier = "essence_ascendance:ascendant"
bonus_at_max = 60.0
minimum_bonus_at_lowest = 5.0

[[bonus]]
# Keep a meaningful doubled manual harvest at completion, reached later. Mystical Agriculture and automated harvesting already provide scalable production; this is a player-attributed route, not a global machine multiplier.
id = "essence_ascendance:crop_yield"
min_tier = "essence_ascendance:awakened"
max_tier = "essence_ascendance:transcendent"
bonus_at_max = 100.0
minimum_bonus_at_lowest = 20.0

[[bonus]]
# Extend five-point progress across all tiers; a modest retaliatory route amid high-health enemies. This is additional reflection and still obeys source eligibility and shield mechanics.
id = "essence_ascendance:damage_reflection"
min_tier = "essence_ascendance:dormant"
max_tier = "essence_ascendance:transcendent"
bonus_at_max = 25.0
minimum_bonus_at_lowest = 5.0

[[bonus]]
# Half wear remains useful with the proposed sane gear durability ladder and pack repair options. Complete it late and keep maintenance meaningful; MA unbreakable armor is disabled by the pack.
id = "essence_ascendance:durability_efficiency"
min_tier = "essence_ascendance:awakened"
max_tier = "essence_ascendance:transcendent"
bonus_at_max = 50.0
minimum_bonus_at_lowest = 10.0

[[bonus]]
# Keep native enchantment spending relevant while making long-term Apothic enchanting investment cheaper. The discount does not raise enchantment quality or erase level requirements.
id = "essence_ascendance:enchanting_efficiency"
min_tier = "essence_ascendance:dormant"
max_tier = "essence_ascendance:ascendant"
bonus_at_max = 50.0
minimum_bonus_at_lowest = 10.0

[[bonus]]
# Round the existing 104% to a clear doubling. Strong XP farms and Ancient Knowledge already exist, so avoid larger multiplicative XP inflation.
id = "essence_ascendance:experience_gain"
min_tier = "essence_ascendance:dormant"
max_tier = "essence_ascendance:transcendent"
bonus_at_max = 100.0
minimum_bonus_at_lowest = 10.0

[[bonus]]
# Increase completion moderately, but postpone it; supports creepers and modded explosions without removing explosive danger or overriding other defenses.
id = "essence_ascendance:explosion_resistance"
min_tier = "essence_ascendance:dormant"
max_tier = "essence_ascendance:ascendant"
bonus_at_max = 50.0
minimum_bonus_at_lowest = 10.0

[[bonus]]
# Moderate fall protection grows through exploration and flight. Just Dire negatefalldamage is enabled; EA retains a partial passive path and its separate traversal skills.
id = "essence_ascendance:fall_resistance"
min_tier = "essence_ascendance:dormant"
max_tier = "essence_ascendance:ascendant"
bonus_at_max = 60.0
minimum_bonus_at_lowest = 10.0

[[bonus]]
# Give gradual Nether safety without granting passive immunity; Just Dire lavaimmunity, potion charms, and EA lava skills remain distinct full solutions.
id = "essence_ascendance:fire_resistance"
min_tier = "essence_ascendance:dormant"
max_tier = "essence_ascendance:ascendant"
bonus_at_max = 60.0
minimum_bonus_at_lowest = 10.0

[[bonus]]
# Round existing 104% to double supported countdown throughput. Keep all five stages; Lure and fishing skills already multiply productivity and native transitions remain authoritative.
id = "essence_ascendance:fishing_speed"
min_tier = "essence_ascendance:dormant"
max_tier = "essence_ascendance:transcendent"
bonus_at_max = 100.0
minimum_bonus_at_lowest = 10.0

[[bonus]]
# Start alongside Fatigue Flight rather than selling a Dormant upgrade before EA ability flight exists. Fifty percent remains controllable alongside other movement systems; does not claim to accelerate opaque jetpacks.
