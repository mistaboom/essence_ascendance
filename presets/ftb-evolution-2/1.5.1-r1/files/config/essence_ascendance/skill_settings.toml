# FTB Evolution 2 1.5.1: reviewed personal progression for solo Normal with automation.
# Candidate pack-specific inputs, not the universal Essence Ascendance defaults.
# All 90 Skills reviewed; every generated rank count is preserved.
# Edit inputs, then run /essence admin balance rebuild. Restart alone reuses the saved profile.
# Percentage/fraction, tick, block and damage units are native values.
# Prerequisites, milestones, selection groups and generated costs are unchanged by this file.
